app = "truck-routing"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "10s"
    method = "GET"
    path = "/"
    timeout = "5s"

[env]
  DJANGO_DEBUG = "False"
  PYTHON_VERSION = "3.10"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512